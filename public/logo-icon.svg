<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="rm-ico-primary" x1="16" y1="16" x2="104" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="45%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="rm-ico-accent" x1="42" y1="52" x2="96" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="rm-ico-node" x1="40" y1="50" x2="60" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Base Soft Squircle Container -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
  
  <!-- Subtle Data Matrix Grid Lines -->
  <path d="M6 36 H114 M6 60 H114 M6 84 H114" stroke="#334155" stroke-width="1" stroke-dasharray="2 4" stroke-opacity="0.45"/>
  <path d="M36 6 V114 M60 6 V114 M84 6 V114" stroke="#334155" stroke-width="1" stroke-dasharray="2 4" stroke-opacity="0.45"/>

  <!-- Left Pillar: Master Data Benchmark (Sampling Frame) -->
  <rect x="26" y="24" width="16" height="72" rx="8" fill="url(#rm-ico-primary)" />
  <!-- Data Segment Ticks on Master Pillar -->
  <rect x="30" y="38" width="8" height="2" rx="1" fill="#93C5FD" fill-opacity="0.8"/>
  <rect x="30" y="58" width="8" height="2" rx="1" fill="#93C5FD" fill-opacity="0.8"/>
  <rect x="30" y="78" width="8" height="2" rx="1" fill="#93C5FD" fill-opacity="0.8"/>

  <!-- Upper Reconcile Loop ('R' Upper Arch / Input Stream) -->
  <path d="M36 24 H64 C79.464 24 92 33.8497 92 46 C92 58.1503 79.464 68 64 68 H42" 
        stroke="url(#rm-ico-primary)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Dynamic Matching Leg: Target Matching Stream -->
  <path d="M50 62 L78 96" 
        stroke="url(#rm-ico-accent)" stroke-width="14" stroke-linecap="round" />

  <!-- Center Match Node (Exact Match Reconciliation Point) -->
  <circle cx="50" cy="62" r="7.5" fill="#0F172A" />
  <circle cx="50" cy="62" r="5" fill="url(#rm-ico-node)" />
  <circle cx="50" cy="62" r="2" fill="#ECFDF5" />

  <!-- Outer Target Linkage Anchors -->
  <circle cx="89" cy="46" r="3.5" fill="#38BDF8" />
  <circle cx="78" cy="96" r="3.5" fill="#34D399" />
</svg>
