services:
  # 1. MySQL Database Container
  db:
    image: mysql:8.0
    container_name: rematch-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: rematch
      MYSQL_USER: rematch
      MYSQL_PASSWORD: rematch_secret
      MYSQL_ROOT_PASSWORD: root_secret
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_secret"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - rematch-network

  # 2. Meilisearch Full-text Engine Container
  meilisearch:
    image: getmeili/meilisearch:v1.16
    container_name: rematch-meilisearch
    restart: unless-stopped
    environment:
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: rematch_meili_master_key
    ports:
      - "7700:7700"
    volumes:
      - meili_data:/meili_data
    networks:
      - rematch-network

  # 3. Laravel Backend API Container
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rematch-backend
    restart: unless-stopped
    command: php -d upload_max_filesize=550M -d post_max_size=550M -d memory_limit=1024M -d max_execution_time=600 artisan serve --host=0.0.0.0 --port=8000
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
    environment:
      APP_NAME: RE-MATCH
      APP_ENV: local
      APP_KEY: base64:2ztv9sIppmYKL0RGNW10i6YmwXJZGUcCBF9GIY6BBmM=
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:8090
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: rematch
      DB_USERNAME: rematch
      DB_PASSWORD: rematch_secret
      SCOUT_DRIVER: meilisearch
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_KEY: rematch_meili_master_key
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      SESSION_DRIVER: database
      SESSION_SECURE_COOKIE: "false"
      SANCTUM_STATEFUL_DOMAINS: desktop-m1n2p7u.tail3128ea.ts.net,desktop-m1n2p7u.tail3128ea.ts.net:8090,desktop-m1n2p7u.tail3128ea.ts.net:8080,desktop-m1n2p7u.tail3128ea.ts.net:5173,localhost,localhost:8090,localhost:8080,localhost:5173,localhost:8000,127.0.0.1,127.0.0.1:8090,127.0.0.1:8080,127.0.0.1:5173,127.0.0.1:8000,backend:8000
      CORS_ALLOWED_ORIGINS: https://desktop-m1n2p7u.tail3128ea.ts.net,https://desktop-m1n2p7u.tail3128ea.ts.net:8090,https://desktop-m1n2p7u.tail3128ea.ts.net:8080,http://desktop-m1n2p7u.tail3128ea.ts.net,http://desktop-m1n2p7u.tail3128ea.ts.net:8090,http://desktop-m1n2p7u.tail3128ea.ts.net:8080,http://localhost:8090,http://localhost:8080,http://localhost:5173,http://localhost:8000,http://127.0.0.1:8090,http://127.0.0.1:8080,http://127.0.0.1:5173,http://127.0.0.1:8000
      BATCHMATCH_DEV_USER_PASSWORD: "321"
      BATCHMATCH_DEV_ADMIN_PASSWORD: "321"
      BATCHMATCH_DEV_PIMPINAN_PASSWORD: "321"
    depends_on:
      db:
        condition: service_healthy
      meilisearch:
        condition: service_started
    networks:
      - rematch-network

  # 4. Laravel Queue Worker Container
  queue-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rematch-queue-worker
    restart: unless-stopped
    command: php -d memory_limit=-1 artisan queue:work --tries=3 --timeout=300
    volumes:
      - ./backend:/var/www/html
    environment:
      APP_NAME: RE-MATCH
      APP_ENV: local
      APP_KEY: base64:2ztv9sIppmYKL0RGNW10i6YmwXJZGUcCBF9GIY6BBmM=
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:8090
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: rematch
      DB_USERNAME: rematch
      DB_PASSWORD: rematch_secret
      SCOUT_DRIVER: meilisearch
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_KEY: rematch_meili_master_key
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      SESSION_DRIVER: database
    depends_on:
      db:
        condition: service_healthy
      meilisearch:
        condition: service_started
      backend:
        condition: service_started
    networks:
      - rematch-network

  # 5. React / Vite Frontend Container
  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    container_name: rematch-frontend
    restart: unless-stopped
    command: npm run dev -- --host 0.0.0.0 --port 8090
    ports:
      - "${FRONTEND_PORT:-8090}:8090"
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      VITE_API_PROXY_TARGET: http://backend:8000
      PORT: 8090
    depends_on:
      backend:
        condition: service_started
    networks:
      - rematch-network

networks:
  rematch-network:
    name: rematch-network
    driver: bridge

volumes:
  db_data:
    name: rematch_db_data
    driver: local
  meili_data:
    name: rematch_meili_data
    driver: local
